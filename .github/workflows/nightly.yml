name: Reference-machine measurements
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    # Sole production reference: Windows 11 / RX 6800 XT, Adrenalin/AMF,
    # MSVC build tools and an interactive desktop. Manual Phase 0 runs are valid.
    runs-on: [self-hosted, Windows, rezie-reference]
    concurrency:
      group: rezie-reference
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Record and verify reference hardware
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $gpu = @(Get-CimInstance Win32_VideoController)
          if ($os.Caption -notmatch 'Windows 11') { throw 'Reference requires Windows 11' }
          if (-not ($gpu | Where-Object Name -match 'RX 6800 XT')) { throw 'Reference requires RX 6800 XT' }
          $os | Select-Object Caption, Version, BuildNumber
          $gpu | Select-Object Name, DriverVersion
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo xtask fetch-deps
      - run: cargo xtask bench
      - run: cargo xtask soak --minutes 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-phase-0
          path: |
            docs/benchmarks/*.json
            target/soak.json
