name: ci-full
on:
  pull_request:
    branches: [main]
    # Required checks must be emitted for docs-only PRs; ci-fast skips their builds.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci-fast:
    uses: ./.github/workflows/ci-fast.yml
    with:
      full_gate: true
  evidence:
    uses: ./.github/workflows/evidence.yml
  platforms:
    needs: ci-fast
    if: needs.ci-fast.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    uses: ./.github/workflows/ci-platform.yml
    with:
      platform: ${{ matrix.os }}
      portable_checks: ${{ matrix.os != 'ubuntu-24.04' }}
  full-gate:
    name: full-gate
    needs: [ci-fast, platforms, evidence]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # No checkout, build or cache: this job only evaluates completed job results.
      - name: Require successful checks or a confirmed documentation-only PR
        env:
          FAST_RESULT: ${{ needs.ci-fast.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          BUILD: ${{ needs.ci-fast.outputs.build }}
          PLATFORMS_RESULT: ${{ needs.platforms.result }}
        run: |
          test "$FAST_RESULT" = success
          test "$EVIDENCE_RESULT" = success
          if [ "$BUILD" = true ]; then
            test "$PLATFORMS_RESULT" = success
          else
            test "$BUILD" = false
            test "$PLATFORMS_RESULT" = skipped
          fi
