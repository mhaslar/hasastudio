[workspace]
resolver = "2"
members = ["crates/rezie-rt", "crates/rezie-core", "crates/rezie-api", "crates/rezie-engine", "crates/rezie-app", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
rezie-core = { path = "crates/rezie-core" }
rezie-api = { path = "crates/rezie-api" }
rezie-engine = { path = "crates/rezie-engine" }
rezie-rt = { path = "crates/rezie-rt" }
libc = "0.2"
anyhow = "1"
arc-swap = "1.7"
crossbeam-channel = "=0.5.15"
crossbeam-queue = "0.3"
eframe = { version = "=0.32.3", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = "0.27"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { version = "=25.0.2", default-features = false, features = ["wgsl", "metal", "dx12", "vulkan"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
debug = 1
