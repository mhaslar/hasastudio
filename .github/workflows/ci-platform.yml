name: ci-platform
run-name: Platform preflight — ${{ inputs.platform }} — ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Hosted platform to validate on the selected branch
        type: choice
        required: true
        options: [windows-2022, macos-14, ubuntu-24.04]
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      portable_checks:
        description: False only when ci-fast already covered Linux portable checks
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true
jobs:
  verify:
    # Map a closed set of hosted labels; never accept a self-hosted runner input.
    runs-on: ${{ fromJSON('{"windows-2022":"windows-2022","macos-14":"macos-14","ubuntu-24.04":"ubuntu-24.04"}')[inputs.platform] }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: hosted-${{ inputs.platform }}
          cache-all-crates: true
          cache-on-failure: true
          cache-directories: .deps
          save-if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2
        with:
          tool: cargo-nextest@0.9.143
      - name: Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libva-dev clang nasm python3-venv patchelf libvulkan1 mesa-vulkan-drivers xvfb
      - name: Record selected source revision
        shell: bash
        run: git rev-parse HEAD
      - run: cargo fmt --all -- --check
      - run: cargo xtask native-deps
      - name: Prepare MSVC headers and compatible libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/windows-build-env.ps1
      - name: Platform-specific Clippy
        if: github.event_name == 'workflow_dispatch' || inputs.portable_checks
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Platform-specific tests
        if: github.event_name == 'workflow_dispatch' || inputs.portable_checks
        run: cargo nextest run --workspace --locked
      - name: Platform-specific doctests
        if: github.event_name == 'workflow_dispatch' || inputs.portable_checks
        run: cargo test --workspace --doc --locked
      - name: Reject incompatible native libraries at build and startup
        if: github.event_name == 'workflow_dispatch' || inputs.portable_checks
        run: python tools/check-native-guards.py
      - name: Assert software override and exact fixture decode
        if: github.event_name == 'workflow_dispatch' || inputs.portable_checks
        env:
          REZIE_DISABLE_HW_DECODE: '1'
        run: cargo xtask decode-check --mode auto --output "${{ runner.temp }}/decode-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Tick correctness only, explicit diagnostic slack
        run: cargo xtask clock-check
      - name: Package and launch GUI (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo xtask dist --smoke
      - name: Package and launch GUI (macOS and Windows)
        if: runner.os != 'Linux'
        run: cargo xtask dist --smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: correctness-${{ inputs.platform }}
          path: |
            target/native-guard-tests.json
            ${{ runner.temp }}/decode-${{ github.run_id }}-${{ github.run_attempt }}/
            target/clock-correctness.json
            target/dist-smoke.txt
            .logs/
          if-no-files-found: warn
          retention-days: 14
